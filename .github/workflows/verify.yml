name: Verify compiler preparation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux-rv64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-14 llvm-14 gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-user mlir-14-tools
      - run: make doctor
      - run: make -j2 build
      - run: make test inspect mlir probe-course-runtime
      - name: Preserve experiment outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: results/
